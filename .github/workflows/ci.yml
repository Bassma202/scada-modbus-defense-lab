name: SCADA Security CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: setup-python@v4
      with:
        python-version: '3.11'
    - name: Run Unit & Gateway Tests
      run: |
        python3 -m unittest discover tests
